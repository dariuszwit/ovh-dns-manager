{% extends "base.html" %}

{% block title %}Faktury — Wybór konta OVH{% endblock %}

{% block breadcrumb %}
<a href="{{ url_for('frontend.dashboard.dashboard') }}">Dashboard</a> /
<span>Faktury — Wybór konta</span>
{% endblock %}

{% block content %}
    <div class="account-wrapper">
        <h2>&#128176; Faktury — Wybierz konto OVH</h2>
        <form method="post">
            <select name="account">
                {% for account in accounts %}
                    <option value="{{ account.name }}">{{ account.name }}</option>
                {% endfor %}
            </select>
            <button type="submit">Kontynuuj</button>
        </form>
        <a href="{{ url_for('frontend.dashboard.dashboard') }}" class="back-link">&larr; Powrót do Dashboardu</a>
    </div>
{% endblock %}
