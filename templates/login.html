{% extends "base.html" %}

{% block title %}Logowanie - OVH Manager{% endblock %}

{% block content %}
    <div class="login-wrapper">
        <div class="login-header">
            <h2>Logowanie</h2>
            <p>Zaloguj się do panelu OVH Manager</p>
        </div>
        <form method="post" class="login-form">
            <label for="username">Login</label>
            <input id="username" name="username" required placeholder="Nazwa użytkownika">

            <label for="password">Hasło</label>
            <input id="password" type="password" name="password" required placeholder="Twoje hasło">

            <button type="submit">Zaloguj się</button>

            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}
        </form>
    </div>
{% endblock %}
